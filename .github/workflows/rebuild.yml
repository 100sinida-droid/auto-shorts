name: 봉안시설 사이트 자동 생성

on:
  push:                       # _builder 폴더를 올리거나 고치면 자동으로 사이트 생성
    branches: [main]
    paths: ["_builder/**", ".github/**"]
  workflow_dispatch:          # Actions 탭에서 수동 실행
  schedule:
    - cron: "17 18 * * 0"     # 매주 월요일 03:17 (한국시간) 데이터 갱신

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 사이트 생성 (API가 막히면 저장된 데이터로 생성)
        working-directory: _builder
        run: python build.py || python build.py --offline || python build.py --from-csv
      - name: 결과 올리기
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "사이트 자동 생성"
          git push
